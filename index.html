<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gran Apertura · AA Solutions Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Modal de Bienvenida -->
<div id="welcomeModal" class="modal-overlay">
  <div class="welcome-hero">
    <p class="welcome-eyebrow">Invitación privada</p>
    <h1 class="welcome-title">Bienvenido a la<br/>Gran Apertura de<br/><span class="welcome-title-gold">AA Solutions Comercial</span></h1>
    <p class="welcome-note">La música de fondo es parte de la experiencia.</p>
    <div class="welcome-actions">
      <button id="enterWithMusic" class="btn-gold" disabled><span id="enterWithMusicLabel">Cargando música...</span></button>
      <button id="enterWithoutMusic" class="btn-gold-outline">Ingresar sin música</button>
    </div>
  </div>
</div>

<!-- Reproductor de música de fondo -->
<div id="musicPlayer" class="music-player" style="display:none;">
  <button id="musicToggle" class="music-button" title="Reproducir/Pausar música">
    <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="#041830" stroke="#fff" stroke-width="1"></polygon>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.08" stroke="#041830" stroke-width="2"></path>
      <circle cx="6.5" cy="12" r="1" fill="#c9a24b"/>
    </svg>
  </button>
  <div id="youtube-player" style="position:absolute; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0; pointer-events:none;"></div>
</div>

<div class="invitacion">

  <!-- SECCIÓN 1 -->
  <section class="slide slide-1 fade-bottom">
    <img src="images/slide1.png" alt="Invitación privada · Gran Apertura AA Solutions Comercial">
  </section>

  <!-- SECCIÓN 2 -->
  <section class="slide slide-2 fade-bottom">
    <img src="images/slide2.png" alt="Esta noche es para ti">
  </section>

  <!-- SECCIÓN 3 -->
  <section class="slide slide-3 fade-bottom">
    <img src="images/slide3.png" alt="Doce años de evolución">
  </section>

  <!-- SECCIÓN 4a: encabezado + fecha + dirección -->
  <section class="slide slide-4a">
    <img src="images/slide4a.png" alt="Cóctel de apertura · Viernes 02 Octubre 2026">
  </section>

  <!-- CONTEO REGRESIVO (HTML + CSS puro) -->
  <section class="countdown-block">
    <p class="countdown-label">Falta para el gran momento</p>
    <div id="countdown" class="countdown">
      <div class="countdown-item">
        <span id="cd-days">00</span>
        <small>Días</small>
      </div>
      <span class="countdown-sep">:</span>
      <div class="countdown-item">
        <span id="cd-hours">00</span>
        <small>Horas</small>
      </div>
      <span class="countdown-sep">:</span>
      <div class="countdown-item">
        <span id="cd-mins">00</span>
        <small>Min</small>
      </div>
      <span class="countdown-sep">:</span>
      <div class="countdown-item">
        <span id="cd-secs">00</span>
        <small>Seg</small>
      </div>
    </div>
  </section>

  <!-- SECCIÓN 4b: botones Ver ubicación / Confirmar asistencia -->
  <section class="slide slide-4b">
    <img src="images/slide4b.png" alt="Botones ver ubicación y confirmar asistencia">

    <a class="hotspot hotspot-location"
       href="https://www.google.com/maps/search/?api=1&query=Bella+Terra+Mall+Santiago+Republica+Dominicana"
       target="_blank" rel="noopener"
       aria-label="Ver ubicación en Google Maps"></a>

    <a class="hotspot hotspot-confirm"
       href="https://wa.me/18293288257?text=Buenas%2C%20confirmo%20mi%20asistencia%20a%20la%20inauguraci%C3%B3n%20de%20AA%20Solutions%20Comercial%20el%20pr%C3%B3ximo%2002%20de%20octubre.%20%C2%A1Gracias!"
       target="_blank" rel="noopener"
       aria-label="Confirmar asistencia por WhatsApp"></a>
  </section>

  <!-- SECCIÓN 4c: cierre + logo -->
  <section class="slide slide-4c">
    <img src="images/slide4c.png" alt="Cierre de invitación y logo AA Solutions Comercial">
  </section>

</div>

<script src="script.js"></script>
</body>
</html>
